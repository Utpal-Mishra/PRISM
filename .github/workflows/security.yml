name: Security

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8

  supply-chain:
    name: Supply chain and Python security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install enterprise and security dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enterprise.txt -r requirements-security.txt
      - name: Audit dependencies
        run: pip-audit -r requirements-enterprise.txt
      - name: Static security analysis
        run: bandit -r enterprise prism -ll
      - name: Detect committed secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.venv|node_modules)/' > /tmp/secrets.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/secrets.json", encoding="utf-8"))
          findings = report.get("results", {})
          if findings:
              for path, entries in findings.items():
                  print(path, len(entries))
              raise SystemExit("Potential committed secrets detected.")
          PY
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prism-enterprise-sbom
          path: sbom.cdx.json
          if-no-files-found: error
