name: CI
on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Validate GitHub Pages application
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/mobile.css
          for f in theme mobile app investigation statistical drivers forecast-intelligence scenario strategy-engine decision-register outcome-feedback connectors registry lineage governance copilot; do test -f "assets/$f.js"; node --check "assets/$f.js"; done
          grep -q -- "mobile-dock" index.html
          grep -q -- "viewport-fit=cover" index.html
          grep -q -- "PRISM_INVESTIGATION_" assets/investigation.js
          grep -q -- "PRISM_STATISTICAL_" assets/statistical.js
          grep -q -- "PRISM_DRIVER_" assets/drivers.js
          grep -q -- "PRISM_FORECAST_" assets/forecast-intelligence.js
          grep -q -- "PRISM_SCENARIO_" assets/scenario.js
          grep -q -- "PRISM_STRATEGY_" assets/strategy-engine.js
          grep -q -- "PRISM_DECISION_" assets/decision-register.js
          grep -q -- "PRISM_OUTCOME_" assets/outcome-feedback.js
          grep -q -- "causal-not-established" assets/decision-register.js
          grep -q -- "causal-not-established" assets/outcome-feedback.js
          grep -q -- "localStorage" assets/scenario.js
          grep -q -- "localStorage" assets/strategy-engine.js
          grep -q -- "localStorage" assets/decision-register.js
          grep -q -- "localStorage" assets/outcome-feedback.js
          test -f registry.html
          grep -q -- "Dataset & Metric Registry" registry.html
          grep -q -- "PRISM_REGISTRY_" assets/registry.js
          test -f lineage.html
          grep -q -- "PRISM_LINEAGE_" assets/lineage.js
          grep -q -- "not causal claims" assets/lineage.js
          test -f governance.html
          grep -q -- "Enterprise Governance" governance.html
          grep -q -- "Download Audit Log" assets/governance.js
          grep -q -- "PRISM_AUDIT_" assets/governance.js
          grep -q -- "Viewer" assets/governance.js
          grep -q -- "Analyst" assets/governance.js
          grep -q -- "Manager" assets/governance.js
          grep -q -- "Admin" assets/governance.js
          grep -q -- "Restricted / PII" assets/governance.js
          grep -q -- "human_approval_required: true" assets/governance.js
          grep -q -- "causal-not-established" assets/governance.js
          grep -q -- "uploaded_data_transmitted: false" assets/governance.js
          grep -q -- "localStorage" assets/governance.js
          grep -q -- "AI Analytical Copilot" assets/copilot.js
          grep -q -- "PRISM_ANALYSIS_" assets/copilot.js
          grep -q -- "evidence-first" assets/copilot.js
          grep -q -- "causal-not-established" assets/copilot.js
          grep -q -- "uploaded_data_transmitted: false" assets/copilot.js
          grep -q -- "MAX_UPLOAD_BYTES" assets/app.js
          grep -q -- "MAX_UPLOAD_ROWS" assets/app.js
          grep -q -- "MAX_UPLOAD_COLUMNS" assets/app.js
          grep -q -- "CSV cell exceeds" assets/app.js
          grep -q -- "Content-Security-Policy" index.html
          grep -q -- "Public demo boundary" index.html
          python -m py_compile enterprise/*.py enterprise/migrations/*.py enterprise/migrations/versions/*.py
          grep -q -- "tenant_id" enterprise/models.py
          grep -q -- "workspace_id" enterprise/models.py
          grep -q -- "OIDC" enterprise/auth.py
          grep -q -- "ROW LEVEL SECURITY" enterprise/migrations/versions/0001_enterprise_foundation.py
          grep -q -- "safe-area-inset-bottom" assets/mobile.css
          grep -q -- "Plotly.Plots.resize" assets/mobile.js
