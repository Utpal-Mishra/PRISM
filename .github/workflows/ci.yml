name: CI

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Validate GitHub Pages application
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/mobile.css
          test -f assets/theme.js
          test -f assets/mobile.js
          test -f assets/app.js
          test -f assets/investigation.js
          test -f assets/statistical.js
          node --check assets/theme.js
          node --check assets/mobile.js
          node --check assets/app.js
          node --check assets/investigation.js
          node --check assets/statistical.js
          grep -q -- "#07110d" assets/styles.css
          grep -q -- "#78e6aa" assets/styles.css
          grep -q -- "#c8f56b" assets/styles.css
          grep -q -- "mobile-menu-toggle" index.html
          grep -q -- "introDetails" index.html
          grep -q -- "mobile-dock" index.html
          grep -q -- "viewport-fit=cover" index.html
          grep -q -- "investigation.js" index.html
          grep -q -- "statistical.js" index.html
          grep -q -- "Download Investigation Pack" assets/investigation.js
          grep -q -- "PRISM_INVESTIGATION_" assets/investigation.js
          grep -q -- "causal" assets/investigation.js
          grep -q -- "Download Statistical Evidence Pack" assets/statistical.js
          grep -q -- "PRISM_STATISTICAL_" assets/statistical.js
          grep -q -- "Spearman" assets/statistical.js
          grep -q -- "Welch" assets/statistical.js
          grep -q -- "chi-square" assets/statistical.js
          grep -q -- "Cramer's V" assets/statistical.js
          grep -q -- "causal-not-established" assets/statistical.js
          grep -q -- "translateX(-106%)" assets/mobile.css
          grep -q -- "safe-area-inset-bottom" assets/mobile.css
          grep -q -- "Plotly.Plots.resize" assets/mobile.js
